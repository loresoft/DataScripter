name: Build Extension

env:
  BUILD_VERSION: "2.0.${{github.run_number}}"
  BUILD_INFORMATION: "2.0.${{github.run_number}}+Branch.${{github.ref_name}}.Sha.${{github.sha}}"

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Install Packages
        run: npm ci

      - name: Test
        run: npm test

      - name: Version Package
        run: npm version "${{env.BUILD_VERSION}}"

      - name: Create Package
        run: npm run package

      - name: Upload Package
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: data-scripter-*.vsix

      - name: Publish to Marketplace
        if: success() && github.event_name != 'pull_request'
        run: npx vsce publish --oidc --packagePath "data-scripter-${{env.BUILD_VERSION}}.vsix"

      - name: Create Release
        if: success() && github.event_name != 'pull_request'
        run: 'gh release create "${{env.BUILD_VERSION}}" data-scripter-*.vsix --title "v${{env.BUILD_VERSION}}"'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
